[workspace]
members = ["crates/weflow-native", "crates/weflow-wcdb-ffi"]
resolver = "2"

[workspace.package]
version = "5.0.1"
edition = "2021"
license = "SEE LICENSE IN LICENSE"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
aes = "0.9"
anyhow = "1.0.98"
cbc = "0.2"
libloading = "0.9"
md-5 = "0.11"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.12"
zstd = "0.14"
jpeg-encoder = "0.7"
